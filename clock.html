<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital World Clock - Multiple Time Zones</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
            color: white;
        }

        .header h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .controls button {
            padding: 10px 20px;
            border: 2px solid white;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .controls button:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .controls button.active {
            background: white;
            color: #667eea;
        }

        .clocks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .clock-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .clock-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4);
        }

        .city-name {
            font-size: 1.4rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 10px;
        }

        .timezone-info {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 15px;
        }

        .time-display {
            font-size: 3rem;
            font-weight: 700;
            color: #667eea;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
            margin-bottom: 15px;
            text-align: center;
        }

        .date-display {
            font-size: 0.95rem;
            color: #666;
            text-align: center;
            margin-bottom: 15px;
        }

        .time-info {
            display: flex;
            justify-content: space-around;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }

        .info-item {
            text-align: center;
        }

        .info-label {
            font-size: 0.75rem;
            color: #999;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 1.1rem;
            font-weight: 600;
            color: #667eea;
        }

        .add-timezone-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            min-height: 280px;
            border: 2px dashed #667eea;
        }

        .add-timezone-card:hover {
            background: rgba(255, 255, 255, 1);
            transform: translateY(-10px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
        }

        .add-timezone-card .plus-icon {
            font-size: 3rem;
            margin-bottom: 10px;
            color: #667eea;
        }

        .add-timezone-card p {
            color: #667eea;
            font-weight: 600;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .modal-content h2 {
            color: #333;
            margin-bottom: 20px;
        }

        .timezone-list {
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .timezone-option {
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: all 0.2s;
        }

        .timezone-option:hover {
            background: #f0f0f0;
            padding-left: 20px;
        }

        .timezone-option:last-child {
            border-bottom: none;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-cancel {
            background: #f0f0f0;
            color: #333;
        }

        .btn-cancel:hover {
            background: #e0e0e0;
        }

        .btn-add {
            background: #667eea;
            color: white;
        }

        .btn-add:hover {
            background: #5568d3;
        }

        .remove-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 30px;
            height: 30px;
            border: none;
            border-radius: 50%;
            background: #ff6b6b;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            transition: all 0.3s;
            opacity: 0;
        }

        .clock-card {
            position: relative;
        }

        .clock-card:hover .remove-btn {
            opacity: 1;
        }

        .remove-btn:hover {
            background: #ff5252;
            transform: scale(1.1);
        }

        .footer {
            text-align: center;
            color: white;
            margin-top: 30px;
            opacity: 0.8;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }

            .time-display {
                font-size: 2rem;
            }

            .clocks-grid {
                grid-template-columns: 1fr;
            }

            .controls {
                flex-direction: column;
            }

            .controls button {
                width: 100%;
            }
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #5568d3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌍 World Clock</h1>
            <p>Real-time display across multiple time zones</p>
        </div>

        <div class="controls">
            <button class="active" onclick="filterClocks('all')">All Zones</button>
            <button onclick="filterClocks('popular')">Popular Cities</button>
            <button onclick="sortClocks('name')">Sort by Name</button>
            <button onclick="sortClocks('offset')">Sort by UTC</button>
        </div>

        <div class="clocks-grid" id="clocksGrid">
            <!-- Clocks will be dynamically added here -->
        </div>

        <div class="footer">
            <p>🕐 Updates every second | Last updated: <span id="lastUpdate">--:--:--</span></p>
        </div>
    </div>

    <!-- Modal for adding timezone -->
    <div class="modal" id="addTimezoneModal">
        <div class="modal-content">
            <h2>Add Time Zone</h2>
            <div class="timezone-list" id="timezoneList">
                <!-- Timezone options will be added here -->
            </div>
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeModal()">Cancel</button>
                <button class="btn-add" onclick="addSelectedTimezone()">Add Zone</button>
            </div>
        </div>
    </div>

    <script>
        // Comprehensive list of time zones with their UTC offsets
        const timezones = [
            // Popular cities
            { name: 'New York', timezone: 'America/New_York', city: 'New York, USA', popular: true },
            { name: 'London', timezone: 'Europe/London', city: 'London, UK', popular: true },
            { name: 'Tokyo', timezone: 'Asia/Tokyo', city: 'Tokyo, Japan', popular: true },
            { name: 'Sydney', timezone: 'Australia/Sydney', city: 'Sydney, Australia', popular: true },
            { name: 'Dubai', timezone: 'Asia/Dubai', city: 'Dubai, UAE', popular: true },
            { name: 'Paris', timezone: 'Europe/Paris', city: 'Paris, France', popular: true },
            { name: 'Hong Kong', timezone: 'Asia/Hong_Kong', city: 'Hong Kong', popular: true },
            { name: 'Singapore', timezone: 'Asia/Singapore', city: 'Singapore', popular: true },
            
            // All other major time zones
            { name: 'Los Angeles', timezone: 'America/Los_Angeles', city: 'Los Angeles, USA' },
            { name: 'Chicago', timezone: 'America/Chicago', city: 'Chicago, USA' },
            { name: 'Denver', timezone: 'America/Denver', city: 'Denver, USA' },
            { name: 'Mexico City', timezone: 'America/Mexico_City', city: 'Mexico City, Mexico' },
            { name: 'Toronto', timezone: 'America/Toronto', city: 'Toronto, Canada' },
            { name: 'São Paulo', timezone: 'America/Sao_Paulo', city: 'São Paulo, Brazil' },
            { name: 'Buenos Aires', timezone: 'America/Argentina/Buenos_Aires', city: 'Buenos Aires, Argentina' },
            { name: 'Lisbon', timezone: 'Europe/Lisbon', city: 'Lisbon, Portugal' },
            { name: 'Berlin', timezone: 'Europe/Berlin', city: 'Berlin, Germany' },
            { name: 'Rome', timezone: 'Europe/Rome', city: 'Rome, Italy' },
            { name: 'Athens', timezone: 'Europe/Athens', city: 'Athens, Greece' },
            { name: 'Cairo', timezone: 'Africa/Cairo', city: 'Cairo, Egypt' },
            { name: 'Mumbai', timezone: 'Asia/Kolkata', city: 'Mumbai, India' },
            { name: 'Bangkok', timezone: 'Asia/Bangkok', city: 'Bangkok, Thailand' },
            { name: 'Shanghai', timezone: 'Asia/Shanghai', city: 'Shanghai, China' },
            { name: 'Seoul', timezone: 'Asia/Seoul', city: 'Seoul, South Korea' },
            { name: 'Manila', timezone: 'Asia/Manila', city: 'Manila, Philippines' },
            { name: 'Jakarta', timezone: 'Asia/Jakarta', city: 'Jakarta, Indonesia' },
            { name: 'Auckland', timezone: 'Pacific/Auckland', city: 'Auckland, New Zealand' },
            { name: 'Fiji', timezone: 'Pacific/Fiji', city: 'Fiji' },
            { name: 'Moscow', timezone: 'Europe/Moscow', city: 'Moscow, Russia' },
            { name: 'Istanbul', timezone: 'Europe/Istanbul', city: 'Istanbul, Turkey' },
            { name: 'Lagos', timezone: 'Africa/Lagos', city: 'Lagos, Nigeria' },
            { name: 'Johannesburg', timezone: 'Africa/Johannesburg', city: 'Johannesburg, South Africa' },
            { name: 'Bangkok', timezone: 'Asia/Bangkok', city: 'Bangkok, Thailand' },
            { name: 'Anchorage', timezone: 'America/Anchorage', city: 'Anchorage, Alaska' },
            { name: 'Honolulu', timezone: 'Pacific/Honolulu', city: 'Honolulu, Hawaii' },
            { name: 'UTC', timezone: 'UTC', city: 'UTC/GMT' },
        ];

        let selectedClocks = [];
        let filterMode = 'all';
        let sortMode = 'default';

        // Initialize with popular cities
        function init() {
            selectedClocks = timezones.filter(tz => tz.popular);
            renderClocks();
            updateAllClocks();
            setInterval(updateAllClocks, 1000);
        }

        function renderClocks() {
            const grid = document.getElementById('clocksGrid');
            grid.innerHTML = '';

            let displayClocks = [...selectedClocks];

            // Apply sorting
            if (sortMode === 'name') {
                displayClocks.sort((a, b) => a.name.localeCompare(b.name));
            } else if (sortMode === 'offset') {
                displayClocks.sort((a, b) => {
                    const offsetA = getUTCOffset(a.timezone);
                    const offsetB = getUTCOffset(b.timezone);
                    return offsetA - offsetB;
                });
            }

            displayClocks.forEach(clock => {
                const card = document.createElement('div');
                card.className = 'clock-card';
                card.id = `clock-${clock.timezone}`;
                card.innerHTML = `
                    <button class="remove-btn" onclick="removeClock('${clock.timezone}')">×</button>
                    <div class="city-name">${clock.name}</div>
                    <div class="timezone-info">${clock.timezone}</div>
                    <div class="time-display" data-timezone="${clock.timezone}">--:--:--</div>
                    <div class="date-display" data-date-timezone="${clock.timezone}">--/--/--</div>
                    <div class="time-info">
                        <div class="info-item">
                            <div class="info-label">UTC Offset</div>
                            <div class="info-value" data-offset="${clock.timezone}">+00:00</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Day</div>
                            <div class="info-value" data-day="${clock.timezone}">Mon</div>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });

            // Add "Add Timezone" button
            const addCard = document.createElement('div');
            addCard.className = 'add-timezone-card';
            addCard.onclick = openModal;
            addCard.innerHTML = `
                <div class="plus-icon">+</div>
                <p>Add Time Zone</p>
            `;
            grid.appendChild(addCard);
        }

        function updateAllClocks() {
            selectedClocks.forEach(clock => {
                updateClockDisplay(clock.timezone);
            });
            updateLastUpdate();
        }

        function updateClockDisplay(timezone) {
            try {
                const now = new Date();
                const formatter = new Intl.DateTimeFormat('en-US', {
                    timeZone: timezone,
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: false,
                });

                const parts = formatter.formatToParts(now);
                const time = parts.map(p => p.value).join('');

                const dateFormatter = new Intl.DateTimeFormat('en-US', {
                    timeZone: timezone,
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    weekday: 'short'
                });

                const dateParts = dateFormatter.formatToParts(now);
                const weekday = dateParts.find(p => p.type === 'weekday')?.value || 'Mon';
                const month = dateParts.find(p => p.type === 'month')?.value || '01';
                const day = dateParts.find(p => p.type === 'day')?.value || '01';
                const year = dateParts.find(p => p.type === 'year')?.value || '2024';

                const dateStr = `${month}/${day}/${year}`;

                const timeElement = document.querySelector(`[data-timezone="${timezone}"]`);
                const dateElement = document.querySelector(`[data-date-timezone="${timezone}"]`);

                if (timeElement) timeElement.textContent = time;
                if (dateElement) dateElement.textContent = `${weekday}, ${dateStr}`;

                // Update UTC offset
                const offsetElement = document.querySelector(`[data-offset="${timezone}"]`);
                if (offsetElement) {
                    offsetElement.textContent = getUTCOffsetString(timezone);
                }

                // Update day
                const dayElement = document.querySelector(`[data-day="${timezone}"]`);
                if (dayElement) {
                    dayElement.textContent = weekday;
                }
            } catch (e) {
                console.error(`Error updating timezone ${timezone}:`, e);
            }
        }

        function getUTCOffset(timezone) {
            const now = new Date();
            const formatter = new Intl.DateTimeFormat('en-US', {
                timeZone: timezone,
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            });

            const parts = formatter.formatToParts(now);
            const tzTime = new Date(
                parseInt(parts.find(p => p.type === 'year').value),
                parseInt(parts.find(p => p.type === 'month').value) - 1,
                parseInt(parts.find(p => p.type === 'day').value),
                parseInt(parts.find(p => p.type === 'hour').value),
                parseInt(parts.find(p => p.type === 'minute').value),
                parseInt(parts.find(p => p.type === 'second').value)
            );

            return (now - tzTime) / (1000 * 60 * 60);
        }

        function getUTCOffsetString(timezone) {
            const offset = getUTCOffset(timezone);
            const hours = Math.floor(Math.abs(offset));
            const minutes = Math.round((Math.abs(offset) - hours) * 60);
            const sign = offset >= 0 ? '+' : '-';
            return `${sign}${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
        }

        function updateLastUpdate() {
            const now = new Date();
            const time = now.toLocaleTimeString('en-US', { hour12: false });
            document.getElementById('lastUpdate').textContent = time;
        }

        function filterClocks(mode) {
            filterMode = mode;
            if (mode === 'popular') {
                selectedClocks = timezones.filter(tz => tz.popular);
            } else if (mode === 'all') {
                selectedClocks = timezones;
            }
            renderClocks();
            updateAllClocks();

            // Update button states
            document.querySelectorAll('.controls button').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
        }

        function sortClocks(mode) {
            sortMode = mode;
            renderClocks();

            // Update button states
            document.querySelectorAll('.controls button').forEach(btn => {
                btn.classList.remove('active');
            });
            if (mode === 'name') {
                document.querySelectorAll('.controls button')[2].classList.add('active');
            } else if (mode === 'offset') {
                document.querySelectorAll('.controls button')[3].classList.add('active');
            }
        }

        function openModal() {
            const modal = document.getElementById('addTimezoneModal');
            const list = document.getElementById('timezoneList');
            list.innerHTML = '';

            timezones.forEach(tz => {
                if (!selectedClocks.find(sc => sc.timezone === tz.timezone)) {
                    const option = document.createElement('div');
                    option.className = 'timezone-option';
                    option.textContent = `${tz.name} (${tz.city})`;
                    option.onclick = () => selectTimezone(tz.timezone);
                    list.appendChild(option);
                }
            });

            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('addTimezoneModal').classList.remove('active');
        }

        let selectedTimezone = null;

        function selectTimezone(timezone) {
            selectedTimezone = timezone;
            document.querySelectorAll('.timezone-option').forEach(opt => {
                opt.style.background = '';
            });
            event.target.style.background = '#f0f0f0';
        }

        function addSelectedTimezone() {
            if (selectedTimezone) {
                const tz = timezones.find(t => t.timezone === selectedTimezone);
                if (!selectedClocks.find(sc => sc.timezone === selectedTimezone)) {
                    selectedClocks.push(tz);
                    renderClocks();
                    updateAllClocks();
                    closeModal();
                    selectedTimezone = null;
                }
            }
        }

        function removeClock(timezone) {
            selectedClocks = selectedClocks.filter(c => c.timezone !== timezone);
            renderClocks();
            updateAllClocks();
        }

        // Initialize on load
        window.addEventListener('DOMContentLoaded', init);

        // Close modal on outside click
        document.getElementById('addTimezoneModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });
    </script>
</body>
</html>
