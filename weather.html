<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
        }

        .app {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .search-section {
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            gap: 10px;
        }

        .search-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid white;
            border-radius: 10px;
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            outline: none;
        }

        .search-input:focus {
            background: white;
        }

        .search-btn {
            padding: 12px 20px;
            background: white;
            color: #667eea;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .location-btn {
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .location-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .weather-content {
            padding: 40px 20px;
            text-align: center;
        }

        .city-name {
            font-size: 1.8rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 10px;
        }

        .weather-main {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
        }

        .weather-icon {
            font-size: 5rem;
        }

        .temperature {
            font-size: 3.5rem;
            font-weight: 700;
            color: #667eea;
        }

        .weather-description {
            font-size: 1.2rem;
            color: #666;
            text-transform: capitalize;
            margin-top: 10px;
        }

        .weather-details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #eee;
        }

        .detail-item {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 10px;
        }

        .detail-label {
            font-size: 0.75rem;
            color: #999;
            text-transform: uppercase;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .detail-value {
            font-size: 1.3rem;
            font-weight: 700;
            color: #333;
        }

        .forecast {
            padding: 20px;
            background: #f9f9f9;
            border-top: 2px solid #eee;
        }

        .forecast-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
        }

        .forecast-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 10px;
        }

        .forecast-item {
            background: white;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid #eee;
            transition: all 0.3s;
        }

        .forecast-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .forecast-day {
            font-size: 0.8rem;
            color: #999;
            margin-bottom: 5px;
        }

        .forecast-icon {
            font-size: 1.5rem;
            margin: 5px 0;
        }

        .forecast-temp {
            font-size: 0.85rem;
            font-weight: 600;
            color: #333;
        }

        .loading {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            padding: 20px;
            background: #ffe5e5;
            color: #c33;
            border-radius: 10px;
            margin: 20px;
        }

        .suggestions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 20px;
        }

        .suggestion-btn {
            padding: 12px;
            background: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
        }

        .suggestion-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 2rem;
            }

            .temperature {
                font-size: 2.5rem;
            }

            .weather-icon {
                font-size: 3rem;
            }

            .weather-details {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌤️ Weather</h1>
            <p>Real-time weather information</p>
        </div>

        <div class="app">
            <div class="search-section">
                <input type="text" class="search-input" id="searchInput" placeholder="Search city..." onkeypress="handleSearchKeypress(event)">
                <button class="search-btn" onclick="searchWeather()">Search</button>
                <button class="location-btn" onclick="getLocationWeather()" title="Get current location">📍</button>
            </div>

            <div id="weatherContent" class="weather-content">
                <div class="suggestions">
                    <button class="suggestion-btn" onclick="searchByCity('New York')">New York</button>
                    <button class="suggestion-btn" onclick="searchByCity('London')">London</button>
                    <button class="suggestion-btn" onclick="searchByCity('Tokyo')">Tokyo</button>
                    <button class="suggestion-btn" onclick="searchByCity('Paris')">Paris</button>
                </div>
                <p style="margin-top: 20px; color: #999;">Search for a city or use your location</p>
            </div>
        </div>
    </div>

    <script>
        // Mock weather data - since we don't have API access
        const mockWeatherData = {
            'New York': {
                city: 'New York, USA',
                temp: 22,
                description: 'Partly cloudy',
                icon: '⛅',
                humidity: 65,
                windSpeed: 12,
                feelsLike: 20,
                forecast: [
                    { day: 'Today', temp: 22, icon: '⛅' },
                    { day: 'Tomorrow', temp: 24, icon: '☀️' },
                    { day: 'Thu', temp: 20, icon: '🌧️' },
                    { day: 'Fri', temp: 23, icon: '⛅' },
                    { day: 'Sat', temp: 25, icon: '☀️' }
                ]
            },
            'London': {
                city: 'London, UK',
                temp: 18,
                description: 'Rainy',
                icon: '🌧️',
                humidity: 78,
                windSpeed: 15,
                feelsLike: 16,
                forecast: [
                    { day: 'Today', temp: 18, icon: '🌧️' },
                    { day: 'Tomorrow', temp: 17, icon: '☁️' },
                    { day: 'Thu', temp: 19, icon: '⛅' },
                    { day: 'Fri', temp: 21, icon: '☀️' },
                    { day: 'Sat', temp: 20, icon: '⛅' }
                ]
            },
            'Tokyo': {
                city: 'Tokyo, Japan',
                temp: 28,
                description: 'Sunny',
                icon: '☀️',
                humidity: 55,
                windSpeed: 10,
                feelsLike: 30,
                forecast: [
                    { day: 'Today', temp: 28, icon: '☀️' },
                    { day: 'Tomorrow', temp: 27, icon: '⛅' },
                    { day: 'Thu', temp: 26, icon: '☁️' },
                    { day: 'Fri', temp: 25, icon: '🌧️' },
                    { day: 'Sat', temp: 29, icon: '☀️' }
                ]
            },
            'Paris': {
                city: 'Paris, France',
                temp: 20,
                description: 'Cloudy',
                icon: '☁️',
                humidity: 70,
                windSpeed: 8,
                feelsLike: 19,
                forecast: [
                    { day: 'Today', temp: 20, icon: '☁️' },
                    { day: 'Tomorrow', temp: 21, icon: '⛅' },
                    { day: 'Thu', temp: 22, icon: '☀️' },
                    { day: 'Fri', temp: 19, icon: '🌧️' },
                    { day: 'Sat', temp: 23, icon: '⛅' }
                ]
            }
        };

        function displayWeather(data) {
            const content = document.getElementById('weatherContent');
            content.innerHTML = `
                <div class="city-name">${data.city}</div>
                <div class="weather-main">
                    <div class="weather-icon">${data.icon}</div>
                    <div>
                        <div class="temperature">${data.temp}°C</div>
                        <div class="weather-description">${data.description}</div>
                    </div>
                </div>
                <div class="weather-details">
                    <div class="detail-item">
                        <div class="detail-label">Feels Like</div>
                        <div class="detail-value">${data.feelsLike}°C</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Humidity</div>
                        <div class="detail-value">${data.humidity}%</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Wind Speed</div>
                        <div class="detail-value">${data.windSpeed} km/h</div>
                    </div>
                </div>
                <div class="forecast">
                    <div class="forecast-title">5-Day Forecast</div>
                    <div class="forecast-grid">
                        ${data.forecast.map(day => `
                            <div class="forecast-item">
                                <div class="forecast-day">${day.day}</div>
                                <div class="forecast-icon">${day.icon}</div>
                                <div class="forecast-temp">${day.temp}°C</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function displayLoading() {
            const content = document.getElementById('weatherContent');
            content.innerHTML = '<div class="loading"><div class="spinner"></div><p>Loading weather...</p></div>';
        }

        function displayError(message) {
            const content = document.getElementById('weatherContent');
            content.innerHTML = `<div class="error-message">❌ ${message}</div>`;
        }

        function searchWeather() {
            const city = document.getElementById('searchInput').value.trim();
            if (city) {
                searchByCity(city);
            }
        }

        function searchByCity(city) {
            displayLoading();
            document.getElementById('searchInput').value = city;

            // Simulate API call delay
            setTimeout(() => {
                const normalizedCity = city.toLowerCase();
                const matchedCity = Object.keys(mockWeatherData).find(
                    key => key.toLowerCase().includes(normalizedCity) || normalizedCity.includes(key.toLowerCase())
                );

                if (matchedCity) {
                    displayWeather(mockWeatherData[matchedCity]);
                } else {
                    displayError(`Weather data for "${city}" not available. Try: New York, London, Tokyo, or Paris`);
                }
            }, 500);
        }

        function handleSearchKeypress(event) {
            if (event.key === 'Enter') {
                searchWeather();
            }
        }

        function getLocationWeather() {
            displayLoading();

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        // In a real app, we would use the coordinates to get weather
                        // For now, we'll show a default city
                        setTimeout(() => {
                            displayWeather(mockWeatherData['New York']);
                            document.getElementById('searchInput').value = 'New York';
                        }, 500);
                    },
                    (error) => {
                        displayError('Unable to get your location. Please search manually.');
                    }
                );
            } else {
                displayError('Geolocation is not supported by your browser.');
            }
        }
    </script>
</body>
</html>
